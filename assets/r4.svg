<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 335" role="img" aria-label="Two triangles meeting at a point and an edge joining them">
<g transform="translate(20,10)">
<polygon points="60,175 250,205 200,120" fill="#6c1d1a" fill-opacity="0.1" stroke="#2b211a" stroke-width="1.3"/>
<polygon points="185,20 245,250 160,215" fill="#6c1d1a" fill-opacity="0.1" stroke="#2b211a" stroke-width="1.3"/>
<line x1="60" y1="175" x2="185" y2="20" stroke="#2b211a" stroke-width="1.6"/>
<line x1="210" y1="140" x2="60" y2="175" stroke="#6c1d1a" stroke-width="2.2" opacity="0.85"/>
<line x1="210" y1="140" x2="185" y2="20" stroke="#6c1d1a" stroke-width="2.2" opacity="0.85"/>
<circle cx="60" cy="175" r="3.8" fill="#2b211a"/>
<circle cx="250" cy="205" r="3.8" fill="#2b211a"/>
<circle cx="200" cy="120" r="3.8" fill="#2b211a"/>
<circle cx="185" cy="20" r="3.8" fill="#2b211a"/>
<circle cx="245" cy="250" r="3.8" fill="#2b211a"/>
<circle cx="160" cy="215" r="3.8" fill="#2b211a"/>
<circle cx="210" cy="140" r="4.8" fill="#f5efde" stroke="#6c1d1a" stroke-width="1.7"/>
<text x="222" y="146" fill="#6c1d1a" font-family="EB Garamond, Georgia, serif" font-size="17" font-style="italic" text-anchor="start">x</text>
<text x="48" y="181" fill="#2b211a" font-family="EB Garamond, Georgia, serif" font-size="17" font-style="italic" text-anchor="end">a</text>
<text x="175" y="22" fill="#2b211a" font-family="EB Garamond, Georgia, serif" font-size="17" font-style="italic" text-anchor="end">d</text>
</g>
<text x="220" y="300" fill="#57473a" font-family="EB Garamond, Georgia, serif" font-size="17" font-style="italic" text-anchor="middle">|𝒦| is contractible; Sh(𝒦) is two disks at x plus an arc,</text>
<text x="220" y="322" fill="#57473a" font-family="EB Garamond, Georgia, serif" font-size="17" font-style="italic" text-anchor="middle">so π₁(Sh 𝒦) ≅ ℤ, generated by the loop x a d x</text>
</svg>
